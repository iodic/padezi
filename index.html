<style>
* { -webkit-box-sizing: border-box; box-sizing: border-box; }

mark { background: #fff0bb; color: #172b4d; padding: 2px 5px; border-bottom: 3px solid #e2a624; border-radius: 4px; }

.answer.good { border-color: #177148; background: #e5f5ec; color: #114e35; }
.answer.bad { border-color: #ad3441; background: #fff0f0; color: #8b2330; }

 .wrap { padding: 18px; } h1 { font-size: 38px; } .brand { font-size: 18px; } .brand b { margin-right: 4px; } .tools button { padding: 8px; }

}
@media print { .header, .nav, .footer, .actions, .tools { display: none; } body { background: #fff; } .card { page-break-inside: avoid; } }

	function toggleScript() { latin = !latin; try { localStorage.setItem('padezi-script',latin ? 'latin' : 'cyrillic'); } catch (e) { saved = false; } if (screen === 'quiz') { quiz(false); } else if (screen === 'learn') { learn(); } else if (screen === 'traps') { trapPage(); } else if (screen === 'result') { finish(false); } else if (screen === 'parents') { parents(); } else { home(false); } }
	return {home:function(){home(true);},learn:learn,trapPage:trapPage,start:start,answer:answer,next:next,hint:hint,retry:retry,again:again,parents:parents,reset:reset,toggleScript:toggleScript,init:function(){home(false);}};
}());
